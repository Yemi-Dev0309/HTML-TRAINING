<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goggle Chrome Clone</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="chrome-top">

        <div class="left-side">

            <button class="tab-menu">
               &#9662;
            </button>

            <div class="browser-tab">

                <div class="chrome-icoon">
                    G
                </div>

                <span>New Tab</span>

                <button class="close-tab">
                    &times;
                </button>

            </div>

            <button class="new-tab">
               +
            </button>
        </div>

        <div class="right-side">

            <button class="gemini-btn">
              ✦ ask Gemini
            </button>

            <button class="window-btn">
              &minus;
            </button>

            <button class="window-btn">
               □
            </button>

            <button class="window-btn close-window">
               &times;
            </button>
        </div>

        <div class="nav-bar">

            <div class="nav-left">
                <button class="nav-btn">→</button>
                <button class="nav-btn">→</button>
                <button class="nav-btn">↻</button>
            </div>

            <div class="address-bar">
                <span class="goggle-small">G</span>

                <input 
                type="text"
                placeholder="Ask Goggle or type a URL"
                >

                <button class="address-icon">☆</button>
            </div>

            <div class="nav-right">
             <button class="nav-btn">🧩</button>

             <button class="profile-small">
                <img src="profile.jpg" alt="profile">
             </button>

             <button class="nav-btn">:</button>
            </div>
        </div>

    </header>
    
</body>
</html>
